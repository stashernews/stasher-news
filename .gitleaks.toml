# Extends the default gitleaks rule set (useDefault) and allowlists two
# synthetic test fixtures that the generic-api-key rule flags as secrets.
# Audited 2026-10-07: neither is a credential (one is an alert dedupe key, one
# is an obviously fake `cr_live_1a2b3c4d5e6f` fixture). Patterns are exact
# line matches so default detection stays fully on and nothing broader is
# suppressed.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic fixtures in rewards tests (not credentials)"
regexTarget = "line"
regexes = [
  "dedupeKey: 'bounty-missing-frozen-fee-42'",
  "credentialCode = 'cr_live_1a2b3c4d5e6f'",
]
