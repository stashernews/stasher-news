name: Tests
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: stasher
          POSTGRES_PASSWORD: stasher
          POSTGRES_DB: stashernews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stasher"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgres://stasher:stasher@localhost:5432/stashernews"
      NODE_ENV: test   # the Task 2 validator only enforces in production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed || true

      - name: Run tests
        run: npm test
