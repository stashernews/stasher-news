x-env_file: &env_file
  - path: .env.development
    required: true
  - path: .env.local
    required: false
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 1m
x-depends-on-db: &depends_on_db
  db:
    condition: service_healthy
    restart: true
x-depends-on-app: &depends_on_app
  app:
    condition: service_healthy
    restart: true


services:
  db:
    container_name: db
    build: ./docker/db
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 && psql -U ${POSTGRES_USER} ${POSTGRES_DB} -c 'SELECT 1 FROM users LIMIT 1'"]
    expose:
      - "5432"
    ports:
      - "5431:5432"
    env_file: *env_file
    volumes:
      # the prefix makes sure the seeds are executed in the correct order instead of alphabetical by default
      - ./docker/db/000_seed.sql.gz:/docker-entrypoint-initdb.d/000_seed.sql.gz
      - db:/var/lib/postgresql/data
    labels:
      CONNECT: "localhost:5431"
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
    command:
      - postgres
      - -c
      - log_min_messages=notice
      - -c
      - log_error_verbosity=terse
  app:
    container_name: app
    stdin_open: true
    tty: true
    build:
      context: ./
      args:
        - UID=${CURRENT_UID}
        - GID=${CURRENT_GID}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    depends_on: *depends_on_db
    env_file: *env_file
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    labels:
      CONNECT: "localhost:3000"
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
  capture:
    container_name: capture
    build:
      context: ./capture
    restart: unless-stopped
    depends_on: *depends_on_app
    profiles:
      - images
      - capture
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
    env_file: *env_file
    environment:
      # configure to screenshot production, because local dev is too slow
      - CAPTURE_URL=http://stacker.news
    expose:
      - "5678"
    ports:
      - "5678:5678"
    labels:
      CONNECT: "localhost:5678"
    cpu_shares: "${CPU_SHARES_LOW}"
  worker:
    container_name: worker
    build:
      context: ./worker
      args:
        - UID=${CURRENT_UID}
        - GID=${CURRENT_GID}
    restart: unless-stopped
    depends_on:
      <<:
         - *depends_on_db
         - *depends_on_app
    env_file: *env_file
    volumes:
      - ./:/app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - npm run worker:dev
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
    networks:
      - default
      - domains-network
  imgproxy:
    container_name: imgproxy
    image: darthsim/imgproxy:v3.23.0
    profiles:
      - images
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "imgproxy", "health" ]
    restart: unless-stopped
    env_file: *env_file
    ports:
      - "3001:8080"
    expose:
      - "8080"
    labels:
      - "CONNECT=localhost:3001"
    cpu_shares: "${CPU_SHARES_LOW}"
  aws:
    container_name: aws
    image: localstack/localstack:4.12
    # healthcheck:
    #   test: ["CMD-SHELL", "awslocal", "s3", "ls", "s3://uploads"]
    #   interval: 10s
    #   timeout: 10s
    #   retries: 10
    #   start_period: 1m
    restart: unless-stopped
    profiles:
      - images
      - domains
    env_file: *env_file
    environment:
      - DEBUG=1
      # we only need s3 and acm emulation, ELBv2 mocks are not provided by localstack
      - SERVICES=s3,acm
    ports:
      - "4566:4566"
    expose:
      - "4566"
    volumes:
      - 'aws:/var/lib/localstack'
      - './docker/aws/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh'
      - './docker/aws/cors.json:/etc/localstack/init/ready.d/cors.json'
    labels:
      - "CONNECT=localhost:4566"
    cpu_shares: "${CPU_SHARES_LOW}"
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    container_name: opensearch
    profiles:
      - search
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -ku admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} --silent --fail localhost:9200/_cluster/health || exit 1"]
    restart: unless-stopped
    env_file: *env_file
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - plugins.security.disabled=true
      - discovery.type=single-node
      - "_JAVA_OPTIONS=-Xms2g -Xmx2g -XX:UseSVE=0"
    ports:
      - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer
    volumes:
      - os:/usr/share/opensearch/data
      - ./docker/opensearch/init-opensearch.sh:/usr/share/opensearch/init-opensearch.sh
      - ./docker/opensearch/seed-embeddings.gz:/usr/share/opensearch/seed-embeddings.gz:ro
    labels:
      CONNECT: "localhost:9200"
    command: ["bash", "/usr/share/opensearch/init-opensearch.sh"]
    cpu_shares: "${CPU_SHARES_LOW}"
  os-dashboard:
    image: opensearchproject/opensearch-dashboards:3.3.0
    container_name: os-dashboard
    restart: unless-stopped
    profiles:
      - search
    depends_on:
      opensearch:
        condition: service_healthy
        restart: true
    env_file: *env_file
    environment:
      - opensearch.ssl.verificationMode=none
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - server.ssl.enabled=false
    ports:
      - 5601:5601
    links:
      - opensearch
    labels:
      CONNECT: "localhost:5601"
    cpu_shares: "${CPU_SHARES_LOW}"
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    profiles:
      - email
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
    ports:
      - "8025:8025"
      # host SMTP port remapped: 1025 is often taken by host mail agents
      # (e.g. protonmail-bridge). the app still reaches mailhog via the
      # docker network (smtp://mailhog:1025), so only the published port changes.
      - "1026:1025"
    links:
      - app
    labels:
      CONNECT: "localhost:8025"
    cpu_shares: "${CPU_SHARES_LOW}"
  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    profiles:
      - domains
    container_name: dnsmasq
    restart: unless-stopped
    ports:
      - "5353:53/tcp"
      - "5353:53/udp"
    command:
      - --no-daemon
      # Wildcard A records for dev test TLDs. Both .sndev and .test are RFC
      # 2606 / 6761 reserved (.test) or invented for sndev (.sndev), so they
      # never collide with real internet hostnames. Pair with macOS
      # /etc/resolver/<tld> to get zero-/etc/hosts dev DNS.
      - --address=/.sndev/127.0.0.1
      - --address=/.test/127.0.0.1
      - --conf-file=/etc/dnsmasq.conf
      - --conf-dir=/etc/dnsmasq.d
    volumes:
      - ./docker/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
      - ./docker/dnsmasq/dnsmasq.d:/etc/dnsmasq.d
    cpu_shares: "${CPU_SHARES_LOW}"
    networks:
      domains-network:
        ipv4_address: 172.30.0.2
  caddy:
    # ALB-equivalent: terminates TLS for custom domains and forwards plain
    # HTTP to the next.js app, so dev mirrors the prod traffic shape and
    # browsers treat custom domains as secure contexts.
    image: caddy:2.10-alpine
    container_name: caddy
    profiles:
      - domains-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpu_shares: "${CPU_SHARES_LOW}"
  monerod:
    build: ./docker/monerod
    restart: unless-stopped
    command:
      - --stagenet
      - --non-interactive
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=38081
      - --restricted-rpc
      - --rpc-ssl=disabled
      - --disable-rpc-ban
      - --zmq-rpc-bind-ip=0.0.0.0
      - --zmq-rpc-bind-port=38082
      - --zmq-pub=tcp://0.0.0.0:38083
      - --confirm-external-bind
      - --confirm-zmq-rpc-external-bind
      - --add-peer=node.sethforprivacy.com:38080
      - --add-peer=stagenet.xmr-tw.org:38080
      - --add-peer=xmr-node.cakewallet.com:38080
    volumes:
      - monerod:/root/.bitmonero
    ports:
      - "38081:38081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:38081/get_height || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
    profiles:
      - monero
  monero-lws:
    build: ./docker/monero-lws
    depends_on:
      - monerod
    restart: unless-stopped
    command:
      - --network=stage
      - --daemon=${MONEROD_ZMQ_RPC_URL}
      - --sub=${MONEROD_ZMQ_PUB_URL}
      - --rest-server=https://0.0.0.0:8443
      - --admin-rest-server=https://0.0.0.0:8081/admin
      - --rest-ssl-key=/keys/lws.key
      - --rest-ssl-certificate=/keys/lws.crt
      - --auto-accept-creation
      - --max-subaddresses=50000
      - --create-queue-max=50000
      - --access-control-origin=stealth.news
      - --confirm-external-bind
      - --disable-admin-auth
      - --webhook-ssl-verification=none
      - --exchange-rate-interval=0
      - --log-level=4
    volumes:
      - monerolws:/home/monero-lws
      - lws-keys:/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null https://127.0.0.1:8443/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
    profiles:
      - monero

volumes:
  db:
  os:
  aws:

  dnsmasq:
  caddy_data:
  caddy_config:
  monerod:
  monerolws:
  lws-keys:

networks:
  default: {}
  domains-network:
    name: domains-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24