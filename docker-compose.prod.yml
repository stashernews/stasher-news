# Production overlay. Usage on the VPS:
#   export NODE_ENV=production   # selects .env.production via x-env_file_app interpolation
#   NODE_ENV=production npm run build   # npm run start serves .next — build BEFORE up
#   docker compose -f docker-compose.yml -f docker-compose.volumes.yml -f docker-compose.prod.yml up -d
# On the mainnet VPS this file is layered with the VPS-local docker-compose.prodmode.yml
# LAST (4-file chain: base + volumes + prod + prodmode). prodmode replaces `command`,
# so this file's app `command` (scripts/deploy-migrate.sh: snapshot -> migrate ->
# rollback hint) does NOT run there — the live boot chain is inline and the pre-deploy
# snapshot is manual by policy. Ground truth for the live chain:
#   docker inspect app --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}'
# (see AGENTS.md "The VPS runs stasher.news publicly in PRODUCTION mode").
# Overrides dev-isms in the base file: dev watch commands -> prod commands,
# explicit NODE_ENV for both processes.
# The volumes-wipe guard lives in docker-compose.volumes.yml and is shared with
# dev-mode deploys — include it here (order above) and always include it.
services:
  app:
    environment:
      - NODE_ENV=production
      - BACKUP_DIR=/backups
    volumes:
      - backups:/backups
    # bind the published app port to loopback (audit follow-up #3): Caddy on
    # the compose network is the only intended ingress. A publicly bound :3000
    # lets direct-to-app requests choose their own X-Forwarded-For and bypass
    # every per-IP rate limit (the rightmost-entry parser trusts the last hop,
    # which for a direct connection is the client itself). External monitoring
    # must use https://stasher.news/api/health (through Caddy), never :3000.
    # !override replaces the base file's 0.0.0.0 bind — without it compose
    # merges ports as a union and the public bind would survive.
    ports: !override
      - "127.0.0.1:3000:3000"
    command:
      - sh
      - -c
      - scripts/deploy-migrate.sh && npm run start
  worker:
    environment:
      - NODE_ENV=production
    command:
      - npm run worker
